name: Ruben de Grauw
group: artistiek-team
role:
  nl: Dirigent koor
  en: Choir conductor
bio:
  nl: >-
    Ruben de Grauw studeerde koordirectie aan het Rotterdams Conservatorium en het Fontys Conservatorium. Hij
    heeft achttien jaar ervaring als dirigent van Jeugdkamerkoor Plurale Tantum en leidt al ruim tien jaar het
    koor van Krashna Musika.
  en: >-
    Ruben de Grauw studied choral conducting at the Rotterdam Conservatory and Fontys Conservatory. He has
    eighteen years of experience conducting the youth chamber choir Plurale Tantum and has led the Krashna
    Musika choir for more than ten years.
order: 2
