name: Stijn Berkouwer
group: artistiek-team
role:
  nl: Dirigent orkest
  en: Orchestra conductor
bio:
  nl: >-
    Stijn Berkouwer is een jonge, energieke dirigent die orkesten in heel Europa heeft gedirigeerd. Hij
    studeerde aan de Hochschule für Musik Hanns Eisler in Berlijn en ontving in 2016 de Anton Kersjesbeurs voor
    jonge dirigenten. Sinds 2019 is hij dirigent van het orkest van Krashna Musika.
  en: >-
    Stijn Berkouwer is a young, energetic conductor who has led orchestras across Europe. He studied at the
    Hochschule für Musik Hanns Eisler in Berlin and received the Anton Kersjes scholarship for young conductors
    in 2016. He has conducted the Krashna Musika orchestra since 2019.
order: 3
