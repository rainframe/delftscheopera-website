nl:
  seo:
    title: Privacy
    description: Hoe de Delftsche Opera omgaat met persoonsgegevens.
  title: Privacyverklaring
  text: |-
    Laatst bijgewerkt: 5 oktober 2026

    ## Wie wij zijn

    Stichting Delftsche Opera Compagnie, gevestigd aan Mekelweg 10, 2628 CD Delft, is verantwoordelijk voor de verwerking van persoonsgegevens zoals beschreven in deze privacyverklaring.

    Contactgegevens:

    Stichting Delftsche Opera Compagnie\
    Mekelweg 10\
    2628 CD Delft\
    [delftscheopera.nl](https://delftscheopera.nl)\
    [info@delftscheopera.nl](mailto:info@delftscheopera.nl)

    Voor alle vragen over privacy kun je mailen naar info@delftscheopera.nl.

    ## Persoonsgegevens die wij verwerken

    Wij verwerken je persoonsgegevens doordat je gebruikmaakt van onze website of nieuwsbrief, of omdat je deze gegevens zelf aan ons verstrekt. Het gaat om:

    - voor- en achternaam;
    - e-mailadres;
    - gegevens die je zelf verstrekt in correspondentie of telefonisch contact;
    - IP-adres, internetbrowser en apparaattype, die technisch nodig zijn om onze website te tonen en te beveiligen.

    ## Bijzondere persoonsgegevens en minderjarigen

    Wij verwerken geen bijzondere of gevoelige persoonsgegevens.

    Onze website en diensten hebben niet de intentie gegevens te verzamelen van personen jonger dan 16 jaar, tenzij zij toestemming hebben van een ouder of voogd. We kunnen echter niet controleren of iemand ouder is dan 16. Wij raden ouders daarom aan betrokken te zijn bij de online activiteiten van hun kinderen. Denk je dat wij zonder die toestemming gegevens van een minderjarige hebben verzameld? Neem dan contact met ons op via info@delftscheopera.nl, dan verwijderen wij deze gegevens.

    ## Waarom wij persoonsgegevens verwerken

    Wij gebruiken je gegevens alleen voor de doelen hieronder, elk met een wettelijke grondslag uit de AVG.

    | Doel | Gegevens | Grondslag |
    | --- | --- | --- |
    | Versturen van onze nieuwsbrief | Naam, e-mailadres | Toestemming (je kunt je altijd afmelden) |
    | Beantwoorden van vragen en correspondentie | Naam, e-mailadres, inhoud van je bericht | Gerechtvaardigd belang: contact met je kunnen onderhouden |
    | Technisch laten werken en beveiligen van de website, en misbruik voorkomen | IP-adres, browser, apparaattype | Gerechtvaardigd belang: een veilige, werkende website |
    | Meten van bezoekersaantallen | Alleen geanonimiseerde, totale aantallen | Gerechtvaardigd belang: de website verbeteren |

    ## Geautomatiseerde besluitvorming

    Wij nemen geen besluiten over jou die uitsluitend gebaseerd zijn op geautomatiseerde verwerking, zoals profilering, en die gevolgen voor je kunnen hebben.

    ## Hoe lang wij persoonsgegevens bewaren

    Wij bewaren je persoonsgegevens niet langer dan nodig is voor het doel waarvoor we ze hebben verzameld.

    | Gegevens | Bewaartermijn |
    | --- | --- |
    | Nieuwsbriefgegevens (naam, e-mailadres) | Tot je je afmeldt. Je e-mailadres wordt dan automatisch verwijderd. |
    | Correspondentie (e-mail, telefonisch contact) | Maximaal 24 maanden na afhandeling van je vraag. |
    | Bezoekersstatistieken | Alleen als geanonimiseerde totalen; wij kunnen 30 dagen terugkijken. |
    | Technische gegevens (IP-adres, browser, apparaattype) | Alleen kort door onze hostingpartij Cloudflare, voor het leveren en beveiligen van de website, volgens het bewaarbeleid van Cloudflare. Wij slaan deze gegevens zelf niet op. |

    ## Delen van persoonsgegevens met derden

    Wij verkopen je gegevens nooit aan derden. Wij delen ze alleen met dienstverleners die ons helpen onze website en communicatie te verzorgen, of als dat wettelijk verplicht is.

    | Dienstverlener | Waarvoor | Welke gegevens |
    | --- | --- | --- |
    | Cloudflare | Hosting, beveiliging en bezoekersstatistieken van de website | IP-adres, browser, apparaattype (statistieken alleen geanonimiseerd) |
    | Brevo | Versturen van onze nieuwsbrief | Naam, e-mailadres |
    | Google Workspace | Onze algemene e-mail | Naam, e-mailadres, inhoud van je bericht |

    Met deze partijen gelden verwerkersovereenkomsten, zodat zij je gegevens alleen in onze opdracht en volgens de AVG verwerken. Sommige van deze partijen kunnen gegevens buiten de Europese Economische Ruimte verwerken. Dat gebeurt alleen met passende waarborgen, zoals het EU-VS Data Privacy Framework of standaardcontractbepalingen van de Europese Commissie.

    ## Cookies en bezoekersstatistieken

    Wij gebruiken geen tracking- of advertentiecookies en wij profileren bezoekers niet.

    Voor bezoekersstatistieken gebruiken wij Cloudflare Web Analytics. Dat werkt zonder cookies en volgt geen individuele bezoekers. Wij zien alleen totalen, zoals het aantal bezoeken per pagina, en kunnen daarin 30 dagen terugkijken.

    Cloudflare kan een technisch noodzakelijke cookie plaatsen om de website te beveiligen, bijvoorbeeld tegen geautomatiseerd misbruik. Je kunt cookies weigeren of verwijderen via de instellingen van je browser. De website kan dan minder goed werken.

    ## Gegevens inzien, aanpassen of verwijderen

    Je hebt het recht om je persoonsgegevens in te zien, te corrigeren of te verwijderen. Ook kun je je toestemming intrekken, bezwaar maken tegen de verwerking van je gegevens en gebruikmaken van je recht op gegevensoverdraagbaarheid. Dat betekent dat je ons kunt vragen de persoonsgegevens waarover wij beschikken in een computerbestand naar jou of een door jou genoemde organisatie te sturen.

    Stuur je verzoek naar info@delftscheopera.nl. Wij reageren binnen een maand.

    Je hebt ook het recht een klacht in te dienen bij de Autoriteit Persoonsgegevens, via <https://autoriteitpersoonsgegevens.nl/nl/contact-met-de-autoriteit-persoonsgegevens/tip-ons>.

    ## Hoe wij persoonsgegevens beveiligen

    Wij nemen de bescherming van je gegevens serieus en nemen passende maatregelen tegen misbruik, verlies, onbevoegde toegang, ongewenste openbaarmaking en ongeoorloofde wijziging. Zo is onze website alleen bereikbaar via een beveiligde verbinding (HTTPS). Alleen bestuursleden en vrijwilligers die de gegevens voor hun taak nodig hebben, hebben toegang. Onze accounts zijn beveiligd met sterke wachtwoorden en tweestapsverificatie.

    Heb je het idee dat je gegevens niet goed beveiligd zijn, of zijn er aanwijzingen van misbruik? Neem dan contact met ons op via info@delftscheopera.nl.
en:
  seo:
    title: Privacy
    description: How Delftsche Opera handles personal data.
  title: Privacy statement
  text: |-
    Last updated: 5 October 2026

    ## Who we are

    Stichting Delftsche Opera Compagnie, located at Mekelweg 10, 2628 CD Delft, the Netherlands, is responsible for the processing of personal data as described in this privacy statement.

    Contact details:

    Stichting Delftsche Opera Compagnie\
    Mekelweg 10\
    2628 CD Delft\
    [delftscheopera.nl](https://delftscheopera.nl)\
    [info@delftscheopera.nl](mailto:info@delftscheopera.nl)

    For any questions about privacy, please email info@delftscheopera.nl.

    ## Personal data we process

    We process your personal data because you use our website or newsletter, or because you provide this data to us yourself. This concerns:

    - first and last name;
    - email address;
    - information you provide in correspondence or by phone;
    - IP address, web browser and device type, which are technically needed to display and secure our website.

    ## Special categories of personal data and minors

    We do not process any special categories of personal data or other sensitive personal data.

    Our website and services do not intend to collect data from people under the age of 16, unless they have permission from a parent or guardian. However, we cannot verify whether someone is over 16. We therefore encourage parents to be involved in their children's online activities. Do you believe we have collected data about a minor without such permission? Please contact us at info@delftscheopera.nl and we will delete this data.

    ## Why we process personal data

    We only use your data for the purposes below, each with a legal basis under the GDPR.

    | Purpose | Data | Legal basis |
    | --- | --- | --- |
    | Sending our newsletter | Name, email address | Consent (you can unsubscribe at any time) |
    | Answering questions and correspondence | Name, email address, content of your message | Legitimate interest: being able to stay in contact with you |
    | Running and securing the website, and preventing misuse | IP address, browser, device type | Legitimate interest: a secure, working website |
    | Measuring visitor numbers | Only anonymised, aggregate numbers | Legitimate interest: improving the website |

    ## Automated decision-making

    We do not make decisions about you that are based solely on automated processing, such as profiling, and that could have consequences for you.

    ## How long we keep personal data

    We do not keep your personal data longer than necessary for the purpose for which it was collected.

    | Data | Retention period |
    | --- | --- |
    | Newsletter data (name, email address) | Until you unsubscribe. Your email address is then deleted automatically. |
    | Correspondence (email, phone contact) | Up to 24 months after your question has been handled. |
    | Visitor statistics | Only as anonymised totals; we can look back 30 days. |
    | Technical data (IP address, browser, device type) | Only briefly by our hosting provider Cloudflare, to deliver and secure the website, in line with Cloudflare's retention policy. We do not store this data ourselves. |

    ## Sharing personal data with third parties

    We never sell your data to third parties. We only share it with service providers who help us run our website and communications, or when required by law.

    | Service provider | Purpose | Data |
    | --- | --- | --- |
    | Cloudflare | Website hosting, security and visitor statistics | IP address, browser, device type (statistics anonymised only) |
    | Brevo | Sending our newsletter | Name, email address |
    | Google Workspace | Our general email | Name, email address, content of your message |

    We have data processing agreements with these parties, so they only process your data on our instructions and in accordance with the GDPR. Some of these parties may process data outside the European Economic Area. This only happens with appropriate safeguards, such as the EU-US Data Privacy Framework or the European Commission's standard contractual clauses.

    ## Cookies and visitor statistics

    We do not use tracking or advertising cookies, and we do not profile visitors.

    For visitor statistics we use Cloudflare Web Analytics. It works without cookies and does not track individual visitors. We only see totals, such as the number of visits per page, and can look back 30 days.

    Cloudflare may place a technically necessary cookie to secure the website, for example against automated abuse. You can refuse or delete cookies through your browser settings. The website may then work less well.

    ## Accessing, correcting or deleting your data

    You have the right to access, correct or delete your personal data. You can also withdraw your consent, object to the processing of your data and exercise your right to data portability. This means you can ask us to send the personal data we hold about you in a computer file to you or to an organisation you name.

    Send your request to info@delftscheopera.nl. We will respond within one month.

    You also have the right to lodge a complaint with the Dutch Data Protection Authority (Autoriteit Persoonsgegevens) via <https://autoriteitpersoonsgegevens.nl/nl/contact-met-de-autoriteit-persoonsgegevens/tip-ons> (in Dutch).

    ## How we protect personal data

    We take the protection of your data seriously and take appropriate measures against misuse, loss, unauthorised access, unwanted disclosure and unauthorised modification. Our website is only accessible via a secure connection (HTTPS). Only board members and volunteers who need the data for their tasks have access. Our accounts are protected with strong passwords and two-factor authentication.

    Do you feel your data is not properly secured, or are there signs of misuse? Please contact us at info@delftscheopera.nl.
