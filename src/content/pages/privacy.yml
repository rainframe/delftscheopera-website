  seo:
    title: Privacy
    description: Hoe de Delftsche Opera omgaat met persoonsgegevens.
  title: Privacyverklaring
  text: |-
    TODO: Concept, ter controle door het bestuur.

    Stichting Delftsche Opera Compagnie (Mekelweg 10, 2628 CD Delft, KvK 41146911) gaat zorgvuldig om met je persoonsgegevens. Hier lees je welke gegevens we verwerken en waarom.

    ## Deze website

    Deze website plaatst geen tracking- of advertentiecookies. Voor bezoekersstatistieken gebruiken we Cloudflare Web Analytics; dat werkt zonder cookies en volgt je niet over andere websites.

    ## Contact

    Als je ons mailt, gebruiken we je naam, e-mailadres en bericht alleen om je vraag te beantwoorden. We bewaren je mail niet langer dan nodig.

    ## Nieuwsbrief

    Schrijf je je in voor onze nieuwsbrief, dan bewaren we je e-mailadres bij onze nieuwsbriefdienst Laposta, een Nederlands bedrijf. Zodra je het aanmeldformulier gebruikt, laadt de website een script van Laposta dat spam tegenhoudt; daarbij ziet Laposta je IP-adres en plaatst het een technisch cookie om het verkeer over zijn servers te verdelen. Je kunt je altijd uitschrijven via de link onderaan elke nieuwsbrief.

    ## Donateurs en sponsors

    Van donateurs, sponsors en partners bewaren we alleen de gegevens die nodig zijn voor onze administratie en om contact te houden.

    ## Jouw rechten

    Je kunt ons altijd vragen welke gegevens we van je hebben, en die laten aanpassen of verwijderen. Mail daarvoor naar [info@delftscheopera.nl](mailto:info@delftscheopera.nl). Ben je het niet eens met hoe we met je gegevens omgaan, dan kun je een klacht indienen bij de Autoriteit Persoonsgegevens.
en:
  seo:
    title: Privacy
    description: How Delftsche Opera handles personal data.
  title: Privacy statement
  text: |-
    TODO: Draft, to be reviewed by the board.

    Stichting Delftsche Opera Compagnie (Mekelweg 10, 2628 CD Delft, the Netherlands; Chamber of Commerce 41146911) handles your personal data with care. This statement explains which data we process and why.

    ## This website

    This website does not use tracking or advertising cookies. For visitor statistics we use Cloudflare Web Analytics, which works without cookies and does not follow you across other websites.

    ## Contact

    If you email us, we only use your name, email address and message to answer your question. We do not keep your email longer than necessary.

    ## Newsletter

    If you subscribe to our newsletter, we store your email address with our newsletter service Laposta, a Dutch company. As soon as you use the signup form, the website loads a script from Laposta that blocks spam; Laposta then sees your IP address and sets a technical cookie to spread traffic across its servers. You can unsubscribe at any time using the link at the bottom of every newsletter.

    ## Donors and sponsors

    For donors, sponsors and partners we only keep the details needed for our administration and to stay in touch.

    ## Your rights

    You can always ask us which data we hold about you, and have it corrected or deleted. Email [info@delftscheopera.nl](mailto:info@delftscheopera.nl). If you are not satisfied with how we handle your data, you can file a complaint with the Dutch Data Protection Authority (Autoriteit Persoonsgegevens).
