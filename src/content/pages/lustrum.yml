en:
  seo:
    title: Lustrum 2028
    description: In 2028 Krashna Musika turns sixty. Delftsche Opera celebrates with a community opera, created together with the people of Delft.
  banner:
    subtitle: 60 years of Krashna Musika
    imageAlt: Choir and orchestra on the stage of a concert hall with a large organ
  intro:
    text: |-
      In 2028 a very special project lies ahead. Together with the people of Delft we will create a community opera, directed by Annemiek van Elst, who recently amazed audiences with the family opera *Atman!* for Dutch National Opera.

      <mark class="todo">More about the concept, venues and dates will follow.</mark>
  krashna:
    text: |-
      Krashna Musika is the student orchestra and choir of Delft. Its choir and orchestra perform large-scale symphonic repertoire at a high level. In 2028 the association turns sixty.

      In 2023 Krashna Musika won the public vote for *Het Leukste Studentenorkest van Nederland* (the most fun student orchestra in the Netherlands), organised by the AVROTROS programme De Klassieken on NPO Klassiek.
    linkLabel: Visit the Krashna Musika website
    imageAlt: Krashna Musika after a concert, with the logo of Het Leukste Studentenorkest van Nederland
