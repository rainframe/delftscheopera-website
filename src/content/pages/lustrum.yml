nl:
  seo:
    title: Lustrum 2028
    description: In 2028 bestaat Krashna Musika zestig jaar. De Delftsche Opera viert dat met een community opera, samen met de mensen in Delft.
  banner:
    title: Lustrum
    subtitle: 60 jaar Krashna Musika
    year: '2028'
    credit: Eduardus Lee
    image: ../../assets/uploads/concertgebouw-lustrum.jpg
    imageAlt: Koor en orkest op het podium van een concertzaal met een groot orgel
  intro:
    title: Community Opera
    text: |-
      In 2028 staat een heel bijzonder project voor de deur. Samen met de mensen in Delft maken we een community opera, onder leiding van regisseur Annemiek van Elst, die onlangs verraste met de familieopera *Atman!* voor De Nationale Opera.

      <mark class="todo">Meer over de opzet, de speellocaties en de data volgt.</mark>
  krashna:
    title: Krashna Musika
    text: |-
      Krashna Musika is hét studentenorkest en -koor uit Delft. Koor en orkest brengen op hoog niveau groot symfonisch repertoire ten gehore. In 2028 bestaat de vereniging zestig jaar.

      In 2023 won Krashna Musika de verkiezing *Het Leukste Studentenorkest van Nederland* van het AVROTROS-programma De Klassieken op NPO Klassiek.
    linkLabel: Naar de website van Krashna Musika
    linkUrl: https://www.krashna.nl
    image: ../../assets/uploads/krashna-leukste-studentenorkest.jpg
    imageAlt: Krashna Musika na afloop van een concert, met het beeldmerk van Het Leukste Studentenorkest van Nederland
  team:
    - annemiek-van-elst
