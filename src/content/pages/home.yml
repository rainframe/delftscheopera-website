nl:
  seo:
    title: Delftsche Opera
    description: In 2028 maakt de Delftsche Opera een community opera, samen met de mensen in Delft en met het studentenorkest en -koor Krashna Musika.
  banner:
    title: Community Opera 2028
    subtitle: In, met en voor Delft
    images:
      - image: /src/assets/uploads/ming-dao-2.jpg
        imageAlt: Een solist in een paarse mantel voor het orkest van Krashna Musika
        credit: Ming Dao
      - image: /src/assets/uploads/ming-dao-1.jpg
        imageAlt: Een spreker en dirigent voor het orkest van Krashna Musika in een concertzaal
        credit: Ming Dao
      - image: /src/assets/uploads/carmina-burana-2023.jpg
        imageAlt: Koor en orkest van Krashna Musika tijdens Carmina Burana, in rood licht
